host: localhost:8080
info:
  contact: {}
  description: This is the API Gateway for VyoLayer
  title: VyoLayer Gateway API
  version: "1.0"
paths:
  /account/change-password:
    post:
      consumes:
      - application/json
      description: Change the user's password
      parameters:
      - description: Change Password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ChangePasswordRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Account
  /account/forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password reset email
      parameters:
      - description: Forgot Password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ForgotPasswordRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      summary: Forgot Password
      tags:
      - Account
  /account/resend-verification-email:
    post:
      consumes:
      - application/json
      description: Resend the email verification link
      parameters:
      - description: Email details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ResendVerificationEmailRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      summary: Resend Verification Email
      tags:
      - Account
  /account/reset-password:
    post:
      consumes:
      - application/json
      description: Reset the user's password using a token
      parameters:
      - description: Reset token
        in: query
        name: token
        required: true
        type: string
      - description: Reset Password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ResetPasswordRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      summary: Reset Password
      tags:
      - Account
  /account/sessions:
    get:
      consumes:
      - application/json
      description: List all active sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.AllSessionsResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: List Sessions
      tags:
      - Account
  /account/sessions/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the access token using the refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.RefreshSessionResponseDTO'
              type: object
      summary: Refresh Token
      tags:
      - Account
  /account/sessions/revoke:
    post:
      consumes:
      - application/json
      description: Revoke a specific session
      parameters:
      - description: Session ID
        in: query
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Revoke Session
      tags:
      - Account
  /account/sessions/revoke-all:
    post:
      consumes:
      - application/json
      description: Revoke all sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Revoke All Sessions
      tags:
      - Account
  /account/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate user and return session tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.LoginResponseDTO'
              type: object
      summary: User Login
      tags:
      - Account
  /account/sign-out:
    post:
      consumes:
      - application/json
      description: Logout user and clear session cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: User Logout
      tags:
      - Account
  /account/sign-up:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.RegisterRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.RegisterResponseDTO'
              type: object
      summary: Register User
      tags:
      - Account
  /account/validate:
    post:
      consumes:
      - application/json
      description: Validate the current access token session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Validate Session
      tags:
      - Account
  /account/verify-email:
    post:
      consumes:
      - application/json
      description: Verify a user's email with a token
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      summary: Verify Email
      tags:
      - Account
  /api-keys:
    get:
      consumes:
      - application/json
      description: List all API keys for a project
      parameters:
      - description: Organization ID
        in: query
        name: orgId
        required: true
        type: string
      - description: Project ID
        in: query
        name: projectId
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page limit
        in: query
        name: limit
        type: integer
      - description: Status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/apikey.ListAPIKeysDTO'
              type: object
